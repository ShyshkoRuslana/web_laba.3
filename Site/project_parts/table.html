<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Візерунок з таблиці</title>
</head>
<body>
    <main>
    <center>
        <table border="2" style="border-collapse: collapse; width: 500px; height: 500px; border: 2px solid black">
            <tr>
                <td colspan="6" bgcolor="#52796f" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td rowspan="6" bgcolor="#84a98c" style="border: 2px solid black"></td>
                <td colspan="4" bgcolor="#52796f" style="border: 2px solid black"></td>
                <td rowspan="6" bgcolor="#84a98c" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td rowspan="4" bgcolor="#84a98c" style="border: 2px solid black"></td>
                <td colspan="2" bgcolor="#52796f" style="border: 2px solid black"></td>
                <td rowspan="4" bgcolor="#84a98c" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td bgcolor="#f4acb7" style="border: 2px solid black"></td>
                <td bgcolor="#ffcad4" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td bgcolor="#ffcad4" style="border: 2px solid black"></td>
                <td bgcolor="#f4acb7" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td colspan="2" bgcolor="#52796f" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td colspan="4" bgcolor="#52796f" style="border: 2px solid black"></td>
            </tr>
            <tr>
                <td colspan="6" bgcolor="#52796f" style="border: 2px solid black"></td>
            </tr>
        </table>
        <br><br>
        <a href="../index.html">Повернутись на головну</a>
    </center>
    </main>
</body>
</html>
